<title>ChromeOS ランチャー</title>
<style>
:root{--surf:rgba(232,241,255,.88);--surf2:rgba(255,255,255,.55);--txt:#1f1f1f;--sub:#444746;--pc:#c2e7ff;--onpc:#001d35;--hov:rgba(0,0,0,.08);--shelf:rgba(226,236,252,.92);--panel:#eef3fd;--tile:#dde6f5;--line:rgba(0,0,0,.14);--acc:#0b57d0;
--w1:#b8f0ff;--w2:#5ab4ff;--w3:#1b3fe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surf:rgba(38,34,34,.92);--surf2:rgba(255,255,255,.08);--txt:#f0e4e0;--sub:#d8c2bc;--pc:#ffb59a;--onpc:#3a0b00;--hov:rgba(255,255,255,.1);--shelf:rgba(40,36,36,.92);--panel:#2b2524;--tile:#4a3c38;--line:rgba(255,255,255,.16);--acc:#ffb59a;--w1:#5a3a2a;--w2:#2a1c1c;--w3:#120c0c}}
:root[data-theme="dark"]{--surf:rgba(38,34,34,.92);--surf2:rgba(255,255,255,.08);--txt:#f0e4e0;--sub:#d8c2bc;--pc:#ffb59a;--onpc:#3a0b00;--hov:rgba(255,255,255,.1);--shelf:rgba(40,36,36,.92);--panel:#2b2524;--tile:#4a3c38;--line:rgba(255,255,255,.16);--acc:#ffb59a;--w1:#5a3a2a;--w2:#2a1c1c;--w3:#120c0c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Google Sans","Roboto","Noto Sans JP","Hiragino Sans",sans-serif;color:var(--txt);background:linear-gradient(160deg,var(--w1),var(--w2) 45%,var(--w3));user-select:none}
svg.wp{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.25);flex:none}
.ic.s{width:32px;height:32px;font-size:15px}
[hidden]{display:none!important}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;display:inline-block;width:1em;overflow:hidden;white-space:nowrap;text-transform:none;direction:ltr;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;font-feature-settings:'liga';vertical-align:middle}
.ic{width:48px;height:48px;border-radius:34%;display:grid;place-items:center;box-shadow:none;font-size:0}
.ic .ms{font-size:28px}.ic.s{width:34px;height:34px}.ic.s .ms{font-size:21px}
.app0 .wb{padding:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.bar input:not([type]){flex:1;min-width:0;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--tile);color:var(--txt);padding:0 14px;font:inherit;outline:0}
.cb{height:36px;padding:0 14px;border-radius:18px;background:var(--pc);color:var(--onpc);display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.cb.t{background:var(--tile);color:var(--txt)}.cb .ms{font-size:20px}
.scroll{flex:1;overflow:auto;padding:12px;min-height:0}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.cam{flex:1;position:relative;background:#000;display:grid;place-items:center;min-height:0}
.cam video{max-width:100%;max-height:100%;transition:opacity .1s}
.shut{width:60px;height:60px;border-radius:50%;border:4px solid var(--txt);background:var(--pc)}
.fr{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;cursor:pointer}
.fr:hover,.fr.sel{background:var(--hov)}.fr .ms{color:var(--acc)}.fr small{color:var(--sub);margin-left:auto}
.lb{position:absolute;inset:0;background:#111;color:#fff;display:flex;flex-direction:column;z-index:2}
.lb img{flex:1;min-height:0;object-fit:contain;width:100%}
.wxc{background:var(--tile);border-radius:20px;padding:14px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes winin{from{opacity:0;transform:scale(.92)}}
@keyframes fall{to{transform:translateY(360px)}}
@keyframes flt{50%{transform:translateY(-6px)}}
@keyframes eq{50%{height:16px}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body[data-wp=sunset]{background:linear-gradient(160deg,#ffe0b2,#ff8a65 45%,#5c3a8a)}
body[data-wp=forest]{background:linear-gradient(160deg,#c8f0d0,#4fae8a 45%,#0d3b3a)}
body[data-wp=night]{background:linear-gradient(160deg,#5b6ee1,#2b3a67 45%,#0b1020)}
#launcher,#qs{display:flex;flex-direction:column;visibility:hidden;opacity:0;transform:translateY(20px) scale(.94);transition:opacity .2s,transform .3s cubic-bezier(.2,0,0,1),visibility 0s .3s}
#qs{display:block;transform-origin:bottom right}
#launcher.open,#qs.open{visibility:visible;opacity:1;transform:none;transition:opacity .2s,transform .3s cubic-bezier(.2,0,0,1);animation:none}
#launcher.stag .app{animation:up .34s both cubic-bezier(.2,0,0,1)}
.pin,.app{transition:background .15s,transform .15s}.pin:active,.app:active{transform:scale(.92)}
.pin .ic{transition:transform .15s}.pin:hover .ic{transform:translateY(-3px)}
.tile{transition:background .2s,color .2s,transform .1s}.tile:active{transform:scale(.97)}
.win{animation:winin .22s cubic-bezier(.2,0,0,1);transition:opacity .2s,transform .2s;resize:both;min-height:200px}
.win.out{opacity:0;transform:scale(.92)}.win.min{opacity:0;transform:translateY(60vh) scale(.3)}
#lock{display:flex;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#lock.open{opacity:1;visibility:visible;transition:opacity .3s}
.ph video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.lb{animation:fade .2s}.lb video{flex:1;min-height:0;width:100%}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:18px}.eq i{width:4px;height:4px;background:var(--acc);border-radius:2px}
.eq.on i{animation:eq .6s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
.pt{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pt i{position:absolute;top:-20px;width:2px;height:16px;background:rgba(255,255,255,.5);animation:fall linear infinite}
.pt.sn i{width:6px;height:6px;border-radius:50%;background:#fff}
#welcome{position:fixed;inset:0;z-index:200;background:#f8fafd;color:#1f1f1f;padding:min(10vh,90px) min(8vw,120px);overflow:hidden;transition:opacity .5s,transform .5s,visibility 0s .5s}
#welcome.gone{opacity:0;visibility:hidden;transform:scale(1.05)}
#welcome h1{font-size:clamp(28px,4vw,42px);font-weight:400;margin-bottom:8px}
#welcome>*{animation:up .7s both cubic-bezier(.2,0,0,1)}
#welcome>:nth-child(2){animation-delay:.1s}#welcome>:nth-child(3){animation-delay:.2s}#welcome>:nth-child(4){animation-delay:.3s}
.wchip{display:inline-flex;align-items:center;gap:8px;margin:36px 10px 0 0;padding:8px 16px;border:1px solid #dadce0;border-radius:20px;background:#fff;font-size:13px}
#wstart{position:absolute;left:min(8vw,120px);bottom:min(8vh,70px);background:#0b57d0;color:#fff;padding:0 28px;height:40px;font-size:14px}
.num{height:36px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--txt);padding:0 8px;font:inherit;text-align:center;outline:0}
.set{display:flex;flex:1;min-height:0}
.snav{width:220px;flex:none;overflow:auto;padding:8px;border-right:1px solid var(--line)}
.snav button{display:flex;gap:12px;align-items:center;width:100%;padding:10px 14px;border-radius:24px;text-align:left;font-size:14px;transition:background .2s,color .2s}
.snav button:hover{background:var(--hov)}.snav button.on{background:var(--pc);color:var(--onpc)}
.spg{padding:12px 28px}
@media (max-width:640px){.set{flex-direction:column}.snav{width:auto;display:flex;border:0;padding:4px}.snav button{width:auto;padding:10px}.snav button span:last-child{display:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{width:140px;height:140px;margin:6px auto 12px;border-radius:50%;background:conic-gradient(var(--pc),var(--tile),var(--pc),var(--tile),var(--pc));display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.disc .ms{font-size:64px;color:var(--acc)}.disc.spin{animation:spin 6s linear infinite}
.tm{flex:1;overflow:auto;background:#1e1e1e;color:#d4d4d4;font:13px/1.6 monospace;padding:12px;user-select:text}
.sh{border-collapse:collapse;font-size:13px}.sh td,.sh th{border:1px solid var(--line);padding:0;min-width:84px}.sh th{background:var(--tile);position:sticky;top:0;font-weight:400;padding:4px;z-index:1}
.sh input{width:100%;border:0;background:transparent;color:var(--txt);padding:6px;font:inherit;outline:0}.sh input:focus{outline:2px solid var(--acc);outline-offset:-2px}
#shelf{transition:transform .25s}body.ah #shelf{transform:translateY(calc(100% - 5px))}body.ah #shelf:hover{transform:none}
body.na *{animation:none!important;transition:none!important}
.snav button,.fr,.cb{transition:background .2s}
/* shelf */
#shelf{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--shelf);backdrop-filter:blur(20px);border-radius:24px 24px 0 0;display:flex;align-items:center;padding:0 8px;z-index:50;margin-bottom:env(safe-area-inset-bottom,0px)}
#lbtn{width:34px;height:34px;border-radius:50%;background:var(--hov);display:grid;place-items:center}
#lbtn i{width:14px;height:14px;border-radius:50%;background:var(--txt);display:block}
#pins{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.pin{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.pin:hover{background:var(--hov)}
.pin.run::after{content:"";position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--txt)}
#tray{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{height:34px;padding:0 14px;border-radius:17px;background:var(--hov);font-size:14px;display:flex;align-items:center;gap:8px}
.pill.on{background:var(--pc);color:var(--onpc)}
/* launcher */
#launcher{position:fixed;left:8px;bottom:56px;width:min(648px,calc(100% - 16px));height:min(688px,calc(100% - 72px));background:var(--surf);backdrop-filter:blur(30px);border-radius:24px;z-index:40;display:none;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.3);transform-origin:bottom left}
#launcher.open{display:flex;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}}
@media (prefers-reduced-motion:reduce){#launcher.open{animation:none}}
.sb{display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:1px solid var(--line);flex:none}
.sb input{flex:1;background:none;border:0;outline:0;font:inherit;font-size:15px;color:var(--txt)}
.sb input::placeholder{color:var(--sub)}
.gdots{display:flex;gap:2px}.gdots b{width:9px;height:9px;border-radius:50%}
#body{flex:1;overflow:auto;padding:0 16px 16px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 8px;font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:12px;font-size:12.5px;width:100%}
.app:hover,.app:focus-visible{background:var(--hov)}
.app span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
#recent.hide{display:none}
hr{border:0;border-top:1px solid var(--line);margin:8px 24px}
.empty{padding:40px;text-align:center;color:var(--sub);font-size:14px}
/* quick settings */
#qs{position:fixed;right:8px;bottom:56px;width:min(360px,calc(100% - 16px));background:var(--panel);border-radius:28px;padding:16px;z-index:45;display:none;box-shadow:0 8px 32px rgba(0,0,0,.35)}
#qs.open{display:block;animation:pop .18s ease-out}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:64px;border-radius:32px;background:var(--tile);text-align:left;font-size:13.5px;line-height:1.25}
.tile small{display:block;font-size:12px;opacity:.8}
.tile.on{background:var(--pc);color:var(--onpc)}
.tile.big{grid-column:span 1}
.tile.sm{min-height:56px;border-radius:28px}
.sl{display:flex;align-items:center;gap:12px;margin-top:14px}
.sl .ico{width:34px;text-align:center;font-size:18px}
.sl input{flex:1;-webkit-appearance:none;appearance:none;height:40px;border-radius:20px;background:linear-gradient(90deg,var(--pc) var(--v,50%),var(--tile) var(--v,50%));outline-offset:2px}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
.sl input::-moz-range-thumb{width:0;height:0;border:0}
.qfoot{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px}
.rb{width:44px;height:36px;border-radius:18px;background:var(--tile);display:grid;place-items:center;font-size:16px}
/* windows */
.win{position:fixed;background:var(--panel);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:20;display:flex;flex-direction:column;overflow:hidden;min-width:280px}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0}
.tb{height:40px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;background:var(--tile);cursor:move;flex:none;font-size:14px}
.tb .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb button{width:28px;height:28px;border-radius:50%}
.tb button:hover{background:var(--hov)}
.wb{flex:1;padding:20px;overflow:auto;font-size:14px;line-height:1.7;user-select:text}
.btn{display:inline-block;margin-top:12px;padding:10px 20px;border-radius:20px;background:var(--acc);color:var(--panel);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--tile);position:relative;border:2px solid var(--sub)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sub);transition:.15s}
.sw.on{background:var(--pc);border-color:var(--pc)}.sw.on::after{left:21px;background:var(--onpc)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:90}
#lock{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(160deg,var(--w2),var(--w3));color:#fff;cursor:pointer}
#lock.open{display:flex}
#lock b{font-size:72px;font-weight:400}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#303030;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:95;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1}
@media (max-width:520px){.grid{grid-template-columns:repeat(4,1fr)}#pins .pin:nth-child(n+4){display:none}#dt{display:none}}
</style>
</head>

      t.classList.toggle('on');t.setAttribute('aria-checked',t.classList.contains('on'))}
    else if(d.th!=null){setTheme(d.th);show('sty')}
    else if(d.ac!=null){S.acc=d.ac;saveS();applyAccent();show('sty')}
    else if(d.wp!=null){try{localStorage.removeItem('cros-wpimg')}catch{}setWp(d.wp);applyS();show('sty')}
    else if(d.a==='btadd'){try{const dv=await navigator.bluetooth.requestDevice({acceptAllDevices:true});btd.push(dv.name||'不明なデバイス');toast((dv.name||'デバイス')+' を検出しました');show('bt')}catch{toast('デバイスは追加されませんでした')}}
    else if(d.a==='ntreq'){try{await Notification.requestPermission()}catch{}show('ntf')}
    else if(d.a==='nttest'){if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification('ChromeOS',{body:'これはテスト通知です'});else toast('通知が許可されていません')}
    else if(d.a==='wel'){$('#welcome').classList.remove('gone')}
    else if(d.a==='wipe'&&confirm('保存した写真・ファイル・設定をすべて削除します。よろしいですか？')){try{localStorage.clear()}catch{}try{indexedDB.deleteDatabase('cros')}catch{}location.reload()}};
  pg.onchange=e=>{const t=e.target,d=t.dataset;
    if(d.sel==='kb'){S.kb=t.value;saveS();tick()}
    else if(d.sel==='zoom'){S.zoom=+t.value;saveS();applyS()}
    else if(d.wpf!=null&&t.files[0]){const u=URL.createObjectURL(t.files[0]),im=new Image();im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,1600/im.width);c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);sv('wpimg',c.toDataURL('image/jpeg',.82));URL.revokeObjectURL(u);applyS();show('sty')};im.src=u}};
  pg.oninput=e=>{const t=e.target;if(t.dataset.r){const m=$('#'+t.dataset.r);m.value=t.value;m.dispatchEvent(new Event('input'));fill(t)}};
  show('net')}
/* first-run welcome */
function init(){const th=ld('theme');if(th)setTheme(th);setWp(ld('wp')||'');$('#vol').addEventListener('input',()=>document.querySelectorAll('audio,video').forEach(a=>a.volume=$('#vol').value/100));$('#wstart').onclick=()=>{$('#welcome').classList.add('gone');sv('welcome','1')};if(ld('welcome'))$('#welcome').classList.add('gone');tiles();applyS();render();tick();setInterval(tick,10000);mark()}
init();
</script>
